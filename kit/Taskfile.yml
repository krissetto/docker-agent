version: "3"

tasks:
  default:
    desc: Build a local Kit v3 (optionally publish after confirmation)
    cmds:
      - task: build-v3

  build-v3:
    desc: Build a Kit v3 from source (default kagent:local-v3)
    env:
      KIT_CLI_ARGS: "{{.CLI_ARGS}}"
    cmds:
      - bash kit/build.sh v3 "$KIT_CLI_ARGS"

  build-v2:
    desc: Build a Kit v2 and its source runtime (default kagent:local-v2)
    env:
      KIT_CLI_ARGS: "{{.CLI_ARGS}}"
    cmds:
      - bash kit/build.sh v2 "$KIT_CLI_ARGS"
