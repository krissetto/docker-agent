# syntax=docker/sandbox-kit:3@sha256:11bb68806aef6a68d45c10c0c3b3dc86c2f794a296b5a933661d9dadf760b753
schemaVersion: "3"
kind: workload
displayName: Custom Docker Agent async subagents
description: Static Docker Agent with the six-agent async hackerspace team.
sourceUrl: https://github.com/docker/docker-agent
licenses: [Apache-2.0]
version: "${{ kit.args.kitVersion }}"
provides:
  - "async-agent-kit@${{ kit.args.kitVersion }}"
dockerfile: ./async-agent.dockerfile
args:
  kitVersion:
    default: "0.1.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: ASYNC_AGENT_KIT_VERSION
    description: Kit packaging version, not the Docker Agent application version.
  diagnostics:
    default: "off"
    enum: ["off", "on"]
    env: ASYNC_AGENT_KIT_DIAGNOSTICS
    description: Opt in to local install and startup markers; no provider calls.
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.openai.com
          - api.anthropic.com
          - generativelanguage.googleapis.com
          - bedrock-runtime.*.amazonaws.com
          - bedrock-runtime.*.amazonaws.com.cn
          - router.requesty.ai
          - api.x.ai
          - api.studio.nebius.com
          - integrate.api.nvidia.com
          - openrouter.ai
          - api.mistral.ai
          - api.minimax.io
          - inference.baseten.co
          - oai.endpoints.kepler.ai.cloud.ovh.net
          - api.groq.com
          - api.fireworks.ai
          - api.deepseek.com
          - api.cerebras.ai
          - api.together.xyz
          - router.huggingface.co
          - api.moonshot.ai
          - ai-gateway.vercel.sh
          - api.cloudflare.com
          - gateway.ai.cloudflare.com
          - api.githubcopilot.com
          - chatgpt.com
          - opencode.ai
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - domain: api.openai.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - domain: api.anthropic.com
            header: x-api-key
            format: "%s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: google
      phase: runtime
      apiKey:
        name: GOOGLE_API_KEY
        proxyManaged: true
        inject:
          - domain: generativelanguage.googleapis.com
            header: x-goog-api-key
            format: "%s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: amazon-bedrock
      phase: runtime
      apiKey:
        name: AWS_BEARER_TOKEN_BEDROCK
        proxyManaged: true
        inject:
          - domain: bedrock-runtime.*.amazonaws.com
            header: Authorization
            format: "Bearer %s"
          - domain: bedrock-runtime.*.amazonaws.com.cn
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: requesty
      phase: runtime
      apiKey:
        name: REQUESTY_API_KEY
        proxyManaged: true
        inject:
          - domain: router.requesty.ai
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: xai
      phase: runtime
      apiKey:
        name: XAI_API_KEY
        proxyManaged: true
        inject:
          - domain: api.x.ai
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: nebius
      phase: runtime
      apiKey:
        name: NEBIUS_API_KEY
        proxyManaged: true
        inject:
          - domain: api.studio.nebius.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: nvidia
      phase: runtime
      apiKey:
        name: NVIDIA_API_KEY
        proxyManaged: true
        inject:
          - domain: integrate.api.nvidia.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: openrouter
      phase: runtime
      apiKey:
        name: OPENROUTER_API_KEY
        proxyManaged: true
        inject:
          - domain: openrouter.ai
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: mistral
      phase: runtime
      apiKey:
        name: MISTRAL_API_KEY
        proxyManaged: true
        inject:
          - domain: api.mistral.ai
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: minimax
      phase: runtime
      apiKey:
        name: MINIMAX_API_KEY
        proxyManaged: true
        inject:
          - domain: api.minimax.io
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: baseten
      phase: runtime
      apiKey:
        name: BASETEN_API_KEY
        proxyManaged: true
        inject:
          - domain: inference.baseten.co
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: ovhcloud
      phase: runtime
      apiKey:
        name: OVH_AI_ENDPOINTS_ACCESS_TOKEN
        proxyManaged: true
        inject:
          - domain: oai.endpoints.kepler.ai.cloud.ovh.net
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: groq
      phase: runtime
      apiKey:
        name: GROQ_API_KEY
        proxyManaged: true
        inject:
          - domain: api.groq.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: fireworks
      phase: runtime
      apiKey:
        name: FIREWORKS_API_KEY
        proxyManaged: true
        inject:
          - domain: api.fireworks.ai
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: deepseek
      phase: runtime
      apiKey:
        name: DEEPSEEK_API_KEY
        proxyManaged: true
        inject:
          - domain: api.deepseek.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: cerebras
      phase: runtime
      apiKey:
        name: CEREBRAS_API_KEY
        proxyManaged: true
        inject:
          - domain: api.cerebras.ai
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: together
      phase: runtime
      apiKey:
        name: TOGETHER_API_KEY
        proxyManaged: true
        inject:
          - domain: api.together.xyz
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: huggingface
      phase: runtime
      apiKey:
        name: HF_TOKEN
        proxyManaged: true
        inject:
          - domain: router.huggingface.co
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: moonshot
      phase: runtime
      apiKey:
        name: MOONSHOT_API_KEY
        proxyManaged: true
        inject:
          - domain: api.moonshot.ai
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: vercel
      phase: runtime
      apiKey:
        name: AI_GATEWAY_API_KEY
        proxyManaged: true
        inject:
          - domain: ai-gateway.vercel.sh
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: cloudflare
      phase: runtime
      apiKey:
        name: CLOUDFLARE_API_TOKEN
        proxyManaged: true
        inject:
          - domain: api.cloudflare.com
            header: Authorization
            format: "Bearer %s"
          - domain: gateway.ai.cloudflare.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: github-copilot
      phase: runtime
      apiKey:
        name: GITHUB_TOKEN
        proxyManaged: true
        inject:
          - domain: api.githubcopilot.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: chatgpt
      phase: runtime
      apiKey:
        name: CHATGPT_OAUTH_TOKEN
        proxyManaged: true
        inject:
          - domain: chatgpt.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: opencode
      phase: runtime
      apiKey:
        name: OPENCODE_API_KEY
        proxyManaged: true
        inject:
          - domain: opencode.ai
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/agent-sessions@1
    config:
      prompt: ["--exec", "--", "{{.Prompt}}"]
      resume: ["--session", "{{.SessionID}}"]
      continue: ["--session=-1"]
  - type: com.docker.sandbox/lifecycle@1
    optional: true
    config:
      install:
        - command:
            - /bin/sh
            - -eu
            - -c
            - |
              [ "${ASYNC_AGENT_KIT_DIAGNOSTICS:-off}" = on ] || exit 0
              umask 077
              directory=/home/agent/.local/state/async-agent-kit/probe
              mkdir -p "$directory"
              printf '%s\n' installed >> "$directory/install.log"
          user: agent
          env: [ASYNC_AGENT_KIT_DIAGNOSTICS]
          description: Record each install invocation when diagnostics are enabled.
      startup:
        - command:
            - /bin/sh
            - -eu
            - -c
            - |
              [ "${ASYNC_AGENT_KIT_DIAGNOSTICS:-off}" = on ] || exit 0
              umask 077
              directory=/home/agent/.local/state/async-agent-kit/probe
              mkdir -p "$directory"
              temporary=$(mktemp "$directory/.ready.XXXXXX")
              trap 'rm -f "$temporary"' EXIT HUP INT TERM
              printf '%s\n' ready > "$temporary"
              mv -f "$temporary" "$directory/ready"
          user: agent
          env: [ASYNC_AGENT_KIT_DIAGNOSTICS]
          description: Atomically refresh the same startup marker when diagnostics are enabled.
