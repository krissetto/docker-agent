# syntax=docker/sandbox-kit:a1d110d@sha256:7b5be06981e0a3b808b8043ad3f2d5edc5df3645ce628c9bae1bca0fc4334557
schemaVersion: "3"
kind: workload
displayName: krissetto's Docker Agent hack with async subagents
description: krissetto's Docker Agent hack with an opinionated agent team
sourceUrl: https://github.com/docker/docker-agent
licenses: [Apache-2.0]
version: "${{ kit.args.kitVersion }}"
provides:
  - "async-agent-kit@${{ kit.args.kitVersion }}"
dockerfile: ./async-agent.dockerfile
args:
  kitVersion:
    default: "0.1.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: ASYNC_AGENT_KIT_VERSION
    description: Kit packaging version, not the Docker Agent application version.
  team:
    default: "auto"
    env: ASYNC_AGENT_KIT_TEAM
    description: Creation-bound guest team path; auto selects workspace hackerspace.yaml then bundled team.
  model:
    default: ""
    env: ASYNC_AGENT_KIT_MODEL
    description: Creation-bound team-wide model override; empty retains team models.
  stateDir:
    default: "/home/agent/.cagent/managed-api"
    env: ASYNC_AGENT_KIT_STATE_DIR
    description: Creation-bound private managed API state base, outside the workspace.
  diagnostics:
    default: "off"
    enum: ["off", "on"]
    env: ASYNC_AGENT_KIT_DIAGNOSTICS
    description: Opt in to local install and startup markers; no provider calls.
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.openai.com
          - api.anthropic.com
          - generativelanguage.googleapis.com
          - api.github.com
          - github.com
  - type: com.docker.sandbox/credential@1
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - domain: api.openai.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - domain: api.anthropic.com
            header: x-api-key
            format: "%s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: google
      phase: runtime
      apiKey:
        name: GOOGLE_API_KEY
        proxyManaged: true
        inject:
          - domain: generativelanguage.googleapis.com
            header: x-goog-api-key
            format: "%s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: github
      phase: runtime
      apiKey:
        name: GH_TOKEN
        proxyManaged: true
        inject:
          - domain: api.github.com
            header: Authorization
            format: "Bearer %s"
          - domain: github.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/agent-sessions@1
    optional: true
    config:
      prompt: ["--exec", "--", "{{.Prompt}}"]
      resume: ["--exec", "--session", "{{.SessionID}}"]
      continue: ["--exec", "--session=-1"]
      list: ["/opt/async-agent/docker-agent", "sessions", "list", "--managed-api", "--managed-api-attach", "--working-dir", "/workspace", "--managed-api-state-dir", "${{ kit.env.ASYNC_AGENT_KIT_STATE_DIR }}", "--quiet"]
  - type: com.docker.sandbox/agent-interactive-sessions@1
    optional: true
    config:
      prompt: ["--", "{{.Prompt}}"]
      resume: ["--session", "{{.SessionID}}"]
      continue: ["--session=-1"]
      newSession: []
      list: ["/opt/async-agent/docker-agent", "sessions", "list", "--managed-api", "--managed-api-attach", "--working-dir", "/workspace", "--managed-api-state-dir", "${{ kit.env.ASYNC_AGENT_KIT_STATE_DIR }}", "--quiet"]
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config:
      filename: ASYNC_AGENT_KIT.md
  - type: com.docker.sandbox/agent-skills@1
    optional: true
    config:
      path: /home/agent/.agents/skills
      mode: readonly
  - type: com.docker.sandbox/git-identity@1
    optional: true
  - type: com.docker.sandbox/ssh-agent@1
    optional: true
    config:
      phase: runtime
      unrestricted: false
      sign: [git]
  - type: com.docker.sandbox/long-running@1
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command:
            - /bin/sh
            - -eu
            - -c
            - |
              [ "${ASYNC_AGENT_KIT_DIAGNOSTICS:-off}" = on ] || exit 0
              umask 077
              directory=/home/agent/.local/state/async-agent-kit/probe
              mkdir -p "$directory"
              printf '%s\n' installed >> "$directory/install.log"
          user: agent
          env: [ASYNC_AGENT_KIT_DIAGNOSTICS]
          description: Record each install invocation when diagnostics are enabled.
      startup:
        - command:
            - /bin/sh
            - -eu
            - -c
            - |
              [ "${ASYNC_AGENT_KIT_DIAGNOSTICS:-off}" = on ] || exit 0
              umask 077
              directory=/home/agent/.local/state/async-agent-kit/probe
              mkdir -p "$directory"
              temporary=$(mktemp "$directory/.ready.XXXXXX")
              trap 'rm -f "$temporary"' EXIT HUP INT TERM
              printf '%s\n' ready > "$temporary"
              mv -f "$temporary" "$directory/ready"
          user: agent
          env: [ASYNC_AGENT_KIT_DIAGNOSTICS]
          description: Atomically refresh the same startup marker when diagnostics are enabled.
        - command: ["/opt/async-agent/start.sh", "${{ kit.env.ASYNC_AGENT_KIT_TEAM }}", "${{ kit.env.ASYNC_AGENT_KIT_STATE_DIR }}", "${{ kit.env.ASYNC_AGENT_KIT_MODEL }}"]
          user: agent
          background: true
          env:
            - ASYNC_AGENT_KIT_TEAM
            - ASYNC_AGENT_KIT_MODEL
            - ASYNC_AGENT_KIT_STATE_DIR
            - OPENAI_API_KEY
            - ANTHROPIC_API_KEY
            - GOOGLE_API_KEY
            - GH_TOKEN
            - HTTP_PROXY
            - HTTPS_PROXY
            - NO_PROXY
            - http_proxy
            - https_proxy
            - no_proxy
            - SSL_CERT_FILE
            - SSL_CERT_DIR
            - SANDBOX_VM_ID
            - SSH_AUTH_SOCK
            - BASH_ENV
            - XDG_CACHE_HOME
            - TMPDIR
            - DOCKER_AGENT_CONFIG_DIR
            - DOCKER_AGENT_TOOLS_DIR
            - DOCKER_AGENT_AUTO_INSTALL
          description: Own the foreground authenticated workspace API until sandbox stop.
