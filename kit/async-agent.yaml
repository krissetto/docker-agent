# syntax=docker/sandbox-kit:4be7f4d@sha256:1deea2a8edfff7e2a2749bc2e47b2fb15d91c39568a62860592e4dd7d8a43d09
schemaVersion: "3"
kind: workload
displayName: krissetto's Docker Agent hack with async subagents
description: krissetto's Docker Agent hack with an opinionated agent team
sourceUrl: https://github.com/docker/docker-agent
licenses: [Apache-2.0]
version: "${{ kit.args.kitVersion }}"
provides:
  - "async-agent-kit@${{ kit.args.kitVersion }}"
dockerfile: ./async-agent.dockerfile
args:
  kitVersion:
    default: "0.1.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: ASYNC_AGENT_KIT_VERSION
    description: Kit packaging version, not the Docker Agent application version.
  diagnostics:
    default: "off"
    enum: ["off", "on"]
    env: ASYNC_AGENT_KIT_DIAGNOSTICS
    description: Opt in to local install and startup markers; no provider calls.
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.openai.com
          - api.anthropic.com
          - generativelanguage.googleapis.com
          - api.github.com
          - github.com
  - type: com.docker.sandbox/credential@1
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - domain: api.openai.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/credential@1
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - domain: api.anthropic.com
            header: x-api-key
            format: "%s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: google
      phase: runtime
      apiKey:
        name: GOOGLE_API_KEY
        proxyManaged: true
        inject:
          - domain: generativelanguage.googleapis.com
            header: x-goog-api-key
            format: "%s"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: github
      phase: runtime
      apiKey:
        name: GH_TOKEN
        proxyManaged: true
        inject:
          - domain: api.github.com
            header: Authorization
            format: "Bearer %s"
          - domain: github.com
            header: Authorization
            format: "Bearer %s"
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/agent-sessions@1
    optional: true
    config:
      prompt: ["--exec", "--", "{{.Prompt}}"]
      resume: ["--exec", "--session", "{{.SessionID}}"]
      continue: ["--exec", "--session=-1"]
      list: ["/opt/async-agent/docker-agent", "sessions", "list", "--managed-api", "--quiet"]
  - type: com.docker.sandbox/agent-interactive-sessions@1
    optional: true
    config:
      prompt: ["--", "{{.Prompt}}"]
      resume: ["--session", "{{.SessionID}}"]
      continue: ["--session=-1"]
      newSession: []
      list: ["/opt/async-agent/docker-agent", "sessions", "list", "--managed-api", "--quiet"]
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config:
      filename: ASYNC_AGENT_KIT.md
  - type: com.docker.sandbox/agent-skills@1
    optional: true
    config:
      path: /home/agent/.agents/skills
      mode: readonly
  - type: com.docker.sandbox/git-identity@1
    optional: true
  - type: com.docker.sandbox/ssh-agent@1
    optional: true
    config:
      phase: runtime
      unrestricted: false
      sign: [git]
  - type: com.docker.sandbox/long-running@1
    optional: true
  - type: com.docker.sandbox/lifecycle@1
    optional: true
    config:
      install:
        - command:
            - /bin/sh
            - -eu
            - -c
            - |
              [ "${ASYNC_AGENT_KIT_DIAGNOSTICS:-off}" = on ] || exit 0
              umask 077
              directory=/home/agent/.local/state/async-agent-kit/probe
              mkdir -p "$directory"
              printf '%s\n' installed >> "$directory/install.log"
          user: agent
          env: [ASYNC_AGENT_KIT_DIAGNOSTICS]
          description: Record each install invocation when diagnostics are enabled.
      startup:
        - command:
            - /bin/sh
            - -eu
            - -c
            - |
              [ "${ASYNC_AGENT_KIT_DIAGNOSTICS:-off}" = on ] || exit 0
              umask 077
              directory=/home/agent/.local/state/async-agent-kit/probe
              mkdir -p "$directory"
              temporary=$(mktemp "$directory/.ready.XXXXXX")
              trap 'rm -f "$temporary"' EXIT HUP INT TERM
              printf '%s\n' ready > "$temporary"
              mv -f "$temporary" "$directory/ready"
          user: agent
          env: [ASYNC_AGENT_KIT_DIAGNOSTICS]
          description: Atomically refresh the same startup marker when diagnostics are enabled.
