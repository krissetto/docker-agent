# syntax=docker/sandbox-kit:3@sha256:11bb68806aef6a68d45c10c0c3b3dc86c2f794a296b5a933661d9dadf760b753
schemaVersion: "3"
kind: mixin
displayName: Scoped Azure endpoint credentials
licenses: [Apache-2.0]
provides: [kagent-azure-credentials@0.1.0]
args:
  azureHost:
    required: true
    pattern: '^[a-z0-9]+([.-][a-z0-9]+)*\.(openai\.azure\.com|services\.ai\.azure\.com)$'
    description: Exact Azure endpoint hostname, without scheme, port, path or wildcard.
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow: ["${{ kit.args.azureHost }}"]
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: azure
      phase: runtime
      apiKey:
        name: AZURE_API_KEY
        proxyManaged: true
        inject:
          - domain: "${{ kit.args.azureHost }}"
            header: Authorization
            format: "Bearer %s"
