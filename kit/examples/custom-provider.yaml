# syntax=docker/sandbox-kit:3@sha256:11bb68806aef6a68d45c10c0c3b3dc86c2f794a296b5a933661d9dadf760b753
schemaVersion: "3"
kind: mixin
displayName: Scoped custom OpenAI-compatible endpoint credentials
licenses: [Apache-2.0]
provides: [kagent-custom-credentials@0.1.0]
args:
  customHost:
    required: true
    pattern: '^[a-z0-9]+([.-][a-z0-9]+)*\.[a-z]{2,}$'
    description: Exact reviewed endpoint hostname, without scheme, port, path or wildcard.
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow: ["${{ kit.args.customHost }}"]
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: custom-provider
      phase: runtime
      apiKey:
        name: CUSTOM_PROVIDER_API_KEY
        proxyManaged: true
        inject:
          - domain: "${{ kit.args.customHost }}"
            header: Authorization
            format: "Bearer %s"
