schemaVersion: "3"
kind: workload
args:
  version: {default: "0.1.0", buildArg: KIT_VERSION, pattern: '[0-9]+\.[0-9]+\.[0-9]+'}
  team: {required: true, enum: [alpha, beta], env: FIXTURE_TEAM}
  port: {default: "8080", pattern: '[0-9]+'}
  text: {default: "", env: FIXTURE_TEXT}
version: "${{ kit.args.version }}"
provides: ["fixture@${{ kit.args.version }}"]
capabilities:
  - type: com.docker.sandbox/port@1
    config: {container: "${{ kit.args.port }}"}
  - type: com.docker.sandbox/lifecycle@1
    config:
      files:
        - path: /home/agent/fixture.txt
          content: "prefix:${{ kit.args.text }}:$HOME:${HOME}"
