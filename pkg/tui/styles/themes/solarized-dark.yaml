version: 1
name: "Solarized Dark"
colors:
  # Text colors
  text_bright: "#eee8d5"
  text_primary: "#93a1a1"
  text_secondary: "#8b9b9d"
  text_muted: "#8b9b9d"
  text_faint: "#586e75"
  
  # Accent colors
  accent: "#1e9ef8"
  accent_muted: "#268bd2"
  
  # Background colors
  background: "#002b36"
  background_alt: "#073642"
  
  # Border colors
  border_secondary: "#586e75"
  
  # Status colors
  success: "#8ea300"
  error: "#fc6967"
  warning: "#c19200"
  info: "#2ca9a0"
  highlight: "#f663aa"
  
  # Brand colors
  # NOTE: Used as selection background in dialogs - must be dark for white text
  brand: "#1a5a8a"
  brand_bg: "#002b36"
  
  # Error colors
  error_strong: "#fc6967"
  error_dark: "#3d1b1e"
  
  # Spinner colors
  spinner_dim: "#1e9ef8"
  spinner_bright: "#32a7f9"
  spinner_brightest: "#4fb3fa"
  
  # Diff colors
  diff_add_bg: "#243315"
  diff_remove_bg: "#3d1b1e"
  
  # UI element colors
  line_number: "#8b9b9d"
  separator: "#586e75"
  selected: "#001a21"
  selected_fg: "#ffffff"
  suggestion_ghost: "#8b9b9d"
  tab_bg: "#002b36"
  tab_active_bg: "#073642"
  tab_active_fg: "#eee8d5"
  tab_inactive_fg: "#8b9b9d"
  tab_border: "#268bd2"

  placeholder: "#8b9b9d"
  # Shared shell/editor semantic colors
  editor_bg: "#073642"
  card_bg: "#073642"
  shell_bg: "#002b36"
  tab_hover_bg: "#073642"
  tab_hover_fg: "#eee8d5"
  tab_drag_bg: "#073642"
  tab_drag_fg: "#eee8d5"
  tab_busy: "#c19200"
  context_empty: "#002b36"
  context_fill: "#2ca9a0"
  context_text: "#8b9b9d"
  resize: "#586e75"
  resize_hover: "#2ca9a0"
  resize_active: "#eee8d5"
  hint: "#8b9b9d"
  focus: "#1e9ef8"
  disabled: "#586e75"
  status_adjacent: "#8b9b9d"
  scrollbar_track: "#1f444e"

  
  # Badge colors
  badge_accent: "#f663aa"
  badge_info: "#2ca9a0"
  badge_success: "#8ea300"

chroma:
  # Syntax highlighting colors - Solarized style
  comment: "#5ca2b8"
  comment_preproc: "#ff692b"
  keyword: "#8ea300"
  keyword_reserved: "#f663aa"
  keyword_namespace: "#2ca9a0"
  keyword_type: "#1e9ef8"
  operator: "#8ea300"
  punctuation: "#8b9b9d"
  name_builtin: "#c19200"
  name_tag: "#1e9ef8"
  name_attribute: "#2ca9a0"
  name_decorator: "#ff692b"
  literal_number: "#f663aa"
  literal_string: "#2ca9a0"
  literal_string_escape: "#fc6967"
  generic_deleted: "#fc6967"
  generic_subheading: "#5ca2b8"
  background: "#002b36"
  error_fg: "#fc6967"
  error_bg: "#3d1b1e"
  success: "#8ea300"

markdown:
  heading: "#1e9ef8"
  link: "#2ca9a0"
  strong: "#eee8d5"
  code: "#c19200"
  code_bg: "#073642"
  blockquote: "#8b9b9d"
  list: "#93a1a1"
  hr: "#586e75"
