version: 1
name: "Gruvbox Dark"
colors:
  # Text colors
  text_bright: "#ebdbb2"
  text_primary: "#ebdbb2"
  text_secondary: "#aea08c"
  text_muted: "#aba094"
  text_faint: "#504945"
  
  # Accent colors
  accent: "#88a99c"
  accent_muted: "#458588"
  
  # Background colors
  background: "#282828"
  background_alt: "#3c3836"
  
  # Border colors
  border_secondary: "#504945"
  
  # Status colors
  success: "#b8bb26"
  error: "#fc7b6b"
  warning: "#fabd2f"
  info: "#8ec07c"
  highlight: "#d58da1"
  
  # Brand colors
  # NOTE: Used as selection background in dialogs - must be dark for white text
  brand: "#2a5a5c"
  brand_bg: "#282828"
  
  # Error colors
  error_strong: "#e38985"
  error_dark: "#3c1f1e"
  
  # Spinner colors
  spinner_dim: "#88a99c"
  spinner_bright: "#96b5a9"
  spinner_brightest: "#a4c1b6"
  
  # Diff colors
  diff_add_bg: "#2d3319"
  diff_remove_bg: "#3c1f1e"
  
  # UI element colors
  line_number: "#a8a099"
  separator: "#928374"
  selected: "#504945"
  selected_fg: "#ffffff"
  suggestion_ghost: "#a6a19c"
  tab_bg: "#282828"
  tab_active_bg: "#3c3836"
  tab_active_fg: "#ebdbb2"
  tab_inactive_fg: "#9a8c7e"
  tab_border: "#d5c4a1"

  placeholder: "#aba094"
  # Shared shell/editor semantic colors
  editor_bg: "#3c3836"
  card_bg: "#3c3836"
  shell_bg: "#282828"
  tab_hover_bg: "#3c3836"
  tab_hover_fg: "#ebdbb2"
  tab_drag_bg: "#504945"
  tab_drag_fg: "#ebdbb2"
  tab_busy: "#fabd2f"
  context_empty: "#282828"
  context_fill: "#8ec07c"
  context_text: "#9a8c7e"
  resize: "#504945"
  resize_hover: "#8ec07c"
  resize_active: "#ebdbb2"
  hint: "#aba094"
  focus: "#83a598"
  disabled: "#504945"
  status_adjacent: "#a89984"
  scrollbar_track: "#424242"

  
  # Badge colors
  badge_accent: "#d3869b"
  badge_info: "#8ec07c"
  badge_success: "#b8bb26"

chroma:
  # Syntax highlighting colors - Gruvbox style
  comment: "#aba094"
  comment_preproc: "#fe8019"
  keyword: "#fc7b6b"
  keyword_reserved: "#d58da1"
  keyword_namespace: "#8ec07c"
  keyword_type: "#fabd2f"
  operator: "#fe8019"
  punctuation: "#ebdbb2"
  name_builtin: "#d58da1"
  name_tag: "#fc7b6b"
  name_attribute: "#fabd2f"
  name_decorator: "#fe8019"
  literal_number: "#d58da1"
  literal_string: "#b8bb26"
  literal_string_escape: "#8ec07c"
  generic_deleted: "#fc7b6b"
  generic_subheading: "#aba094"
  background: "#282828"
  error_fg: "#fc7b6b"
  error_bg: "#3c1f1e"
  success: "#b8bb26"

markdown:
  heading: "#83a598"
  link: "#8ec07c"
  strong: "#ebdbb2"
  code: "#fabd2f"
  code_bg: "#3c3836"
  blockquote: "#a89984"
  list: "#ebdbb2"
  hr: "#504945"
