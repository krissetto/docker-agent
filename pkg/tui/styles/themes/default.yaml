version: 1
name: "Old School"
colors:
  # Text colors
  text_bright: "#E5F2FC"
  text_primary: "#C0C0C0"
  text_secondary: "#8f8f8f"
  text_muted: "#8f8f8f"
  text_faint: "#404550"

  # Accent colors
  accent: "#7AA2F7"
  accent_muted: "#8B95C1"

  # Background colors
  background: "#1C1C22"
  background_alt: "#24283B"

  # Border colors
  border_secondary: "#6B75A8"

  # Status colors
  success: "#9ECE6A"
  error: "#F7768E"
  warning: "#E0AF68"
  info: "#7DCFFF"
  highlight: "#98C379"

  # Brand colors
  brand: "#1D63ED"
  brand_bg: "#202a4b"

  # Error colors
  error_strong: "#e06d5e"
  error_dark: "#4a2523"

  # Spinner colors
  spinner_dim: "#9AB8F9"
  spinner_bright: "#B8CFFB"
  spinner_brightest: "#D6E5FC"

  # Diff colors
  diff_add_bg: "#20303B"
  diff_remove_bg: "#3C2A2A"

  # UI element colors
  line_number: "#888eac"
  separator: "#414868"
  selected: "#364A82"
  selected_fg: "#ffffff"
  suggestion_ghost: "#8c8c8c"
  tab_bg: "#1C1C22"
  tab_active_bg: "#25252c"
  tab_active_fg: "#E5F2FC"
  tab_inactive_fg: "#848484"
  tab_border: "#7AA2F7"

  placeholder: "#8c8c8c"
  # Shared shell/editor semantic colors
  editor_bg: "#25252c"
  card_bg: "#24283B"
  shell_bg: "#1C1C22"
  tab_hover_bg: "#24283B"
  tab_hover_fg: "#E5F2FC"
  tab_drag_bg: "#364A82"
  tab_drag_fg: "#E5F2FC"
  tab_busy: "#E0AF68"
  context_empty: "#1C1C22"
  context_fill: "#7DCFFF"
  context_text: "#848484"
  resize: "#6B75A8"
  resize_hover: "#7DCFFF"
  resize_active: "#E5F2FC"
  hint: "#8c8c8c"
  focus: "#7AA2F7"
  disabled: "#404550"
  status_adjacent: "#848484"
  scrollbar_track: "#38383d"


  # Badge colors
  badge_accent: "#B083EA"
  badge_info: "#7DCFFF"
  badge_success: "#9ECE6A"

  # Agent colors (hue values 0-360 for dynamic palette generation)
  agent_hues: [220, 280, 170, 30, 330, 140, 200, 260, 50, 0, 185, 20, 235, 295, 155, 340]

chroma:
  # Syntax highlighting colors (Monokai-inspired)
  error_fg: "#272727"
  error_bg: "#e06d5e"
  success: "#00D787"
  comment: "#8f8f8f"
  comment_preproc: "#FF875F"
  keyword: "#00AAFF"
  keyword_reserved: "#FF5FD2"
  keyword_namespace: "#FF5F87"
  keyword_type: "#8686df"
  operator: "#EF8080"
  punctuation: "#E8E8A8"
  name_builtin: "#FF8EC7"
  name_tag: "#B083EA"
  name_attribute: "#8585e8"
  name_decorator: "#FFFF87"
  literal_number: "#6EEFC0"
  literal_string: "#C69669"
  literal_string_escape: "#AFFFD7"
  generic_deleted: "#FD5B5B"
  generic_subheading: "#8f8f8f"
  background: "#373737"

markdown:
  heading: "#7AA2F7"
  link: "#7AA2F7"
  strong: "#C0C0C0"
  code: "#C0C0C0"
  code_bg: "#24283B"
  blockquote: "#848484"
  list: "#C0C0C0"
  hr: "#6B75A8"
