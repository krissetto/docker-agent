version: 1
name: "Nord"
colors:
  # Text colors
  text_bright: "#eceff4"
  text_primary: "#d8dee9"
  text_secondary: "#8fbcbb"
  text_muted: "#a6aebc"
  text_faint: "#434c5e"
  
  # Accent colors
  accent: "#96b1cb"
  accent_muted: "#5e81ac"
  
  # Background colors
  background: "#2e3440"
  background_alt: "#3b4252"
  
  # Border colors
  border_secondary: "#4c566a"
  
  # Status colors
  success: "#a3be8c"
  error: "#d89fa4"
  warning: "#ebcb8b"
  info: "#88c0d0"
  highlight: "#c3a5bd"
  
  # Brand colors
  # NOTE: Used as selection background in dialogs - must be dark for white text
  brand: "#3a5070"
  brand_bg: "#2e3440"
  
  # Error colors
  error_strong: "#d89fa4"
  error_dark: "#3d2a2a"
  
  # Spinner colors
  spinner_dim: "#96b1cb"
  spinner_bright: "#a4bdd5"
  spinner_brightest: "#b2c9de"
  
  # Diff colors
  diff_add_bg: "#2a3d2a"
  diff_remove_bg: "#3d2a2a"
  
  # UI element colors
  line_number: "#a6aebc"
  separator: "#616e88"
  selected: "#434c5e"
  selected_fg: "#ffffff"
  suggestion_ghost: "#a6aebc"
  tab_bg: "#2e3440"
  tab_active_bg: "#3b4252"
  tab_active_fg: "#eceff4"
  tab_inactive_fg: "#8fbcbb"
  tab_border: "#88c0d0"

  placeholder: "#8fbcbb"
  # Shared shell/editor semantic colors
  editor_bg: "#3b4252"
  card_bg: "#3b4252"
  shell_bg: "#2e3440"
  tab_hover_bg: "#3b4252"
  tab_hover_fg: "#eceff4"
  tab_drag_bg: "#434c5e"
  tab_drag_fg: "#eceff4"
  tab_busy: "#ebcb8b"
  context_empty: "#2e3440"
  context_fill: "#88c0d0"
  context_text: "#8fbcbb"
  resize: "#4c566a"
  resize_hover: "#88c0d0"
  resize_active: "#eceff4"
  hint: "#8fbcbb"
  focus: "#81a1c1"
  disabled: "#4c566a"
  status_adjacent: "#8fbcbb"
  scrollbar_track: "#474c57"

  
  # Badge colors
  badge_accent: "#b48ead"
  badge_info: "#88c0d0"
  badge_success: "#a3be8c"

chroma:
  # Syntax highlighting colors - Nord style
  comment: "#a6aebc"
  comment_preproc: "#9ab0cb"
  keyword: "#96b1cb"
  keyword_reserved: "#9ab0cb"
  keyword_namespace: "#88c0d0"
  keyword_type: "#96b1cb"
  operator: "#96b1cb"
  punctuation: "#eceff4"
  name_builtin: "#daa08d"
  name_tag: "#d89fa4"
  name_attribute: "#daa08d"
  name_decorator: "#daa08d"
  literal_number: "#c3a5bd"
  literal_string: "#a3be8c"
  literal_string_escape: "#ebcb8b"
  generic_deleted: "#d89fa4"
  generic_subheading: "#a9aeb7"
  background: "#2e3440"
  error_fg: "#d89fa4"
  error_bg: "#3d2a2a"
  success: "#a3be8c"

markdown:
  heading: "#81a1c1"
  link: "#88c0d0"
  strong: "#eceff4"
  code: "#88c0d0"
  code_bg: "#3b4252"
  blockquote: "#939cad"
  list: "#d8dee9"
  hr: "#434c5e"
