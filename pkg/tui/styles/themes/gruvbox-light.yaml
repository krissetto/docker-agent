version: 1
name: "Gruvbox Light"
colors:
  # Text colors - using darker gruvbox colors for better contrast on light bg
  text_bright: "#282828"
  text_primary: "#282828"
  text_secondary: "#3c3836"
  text_muted: "#504945"
  text_faint: "#7c6f64"
  
  # Accent colors
  accent: "#076678"
  accent_muted: "#427b58"
  
  # Background colors
  background: "#fbf1c7"
  background_alt: "#ebdbb2"
  
  # Border colors
  border_secondary: "#928374"
  
  # Status colors
  success: "#68630c"
  error: "#9d0006"
  warning: "#86570f"
  info: "#076678"
  highlight: "#8f3f71"
  
  # Brand colors
  # NOTE: Used as selection background in dialogs - must be dark for white text
  brand: "#3a6a3c"
  brand_bg: "#ebdbb2"
  
  # Error colors
  error_strong: "#9d0006"
  error_dark: "#f9e0e0"
  
  # Spinner colors
  spinner_dim: "#076678"
  spinner_bright: "#076678"
  spinner_brightest: "#076678"
  
  # Diff colors
  diff_add_bg: "#d5e5d0"
  diff_remove_bg: "#f2dede"
  
  # UI element colors
  line_number: "#6b5f56"
  separator: "#a89984"
  selected: "#d5c4a1"
  selected_fg: "#ffffff"
  suggestion_ghost: "#6b5f56"
  tab_bg: "#fbf1c7"
  tab_active_bg: "#ebdbb2"
  tab_active_fg: "#282828"
  tab_inactive_fg: "#665c54"
  tab_border: "#427b58"

  placeholder: "#504945"
  # Shared shell/editor semantic colors
  editor_bg: "#ebdbb2"
  card_bg: "#ebdbb2"
  shell_bg: "#fbf1c7"
  tab_hover_bg: "#ebdbb2"
  tab_hover_fg: "#282828"
  tab_drag_bg: "#d5c4a1"
  tab_drag_fg: "#282828"
  tab_busy: "#b57614"
  context_empty: "#fbf1c7"
  context_fill: "#076678"
  context_text: "#504945"
  resize: "#928374"
  resize_hover: "#076678"
  resize_active: "#282828"
  hint: "#504945"
  focus: "#076678"
  disabled: "#7c6f64"
  status_adjacent: "#3c3836"
  scrollbar_track: "#ddd4af"

  
  # Badge colors
  badge_accent: "#8f3f71"
  badge_info: "#076678"
  badge_success: "#79740e"

chroma:
  # Syntax highlighting colors - Gruvbox Light style
  comment: "#71655a"
  comment_preproc: "#af3a03"
  keyword: "#9d0006"
  keyword_reserved: "#8f3f71"
  keyword_namespace: "#3d7151"
  keyword_type: "#8e5c10"
  operator: "#af3a03"
  punctuation: "#3c3836"
  name_builtin: "#8f3f71"
  name_tag: "#9d0006"
  name_attribute: "#8e5c10"
  name_decorator: "#af3a03"
  literal_number: "#8f3f71"
  literal_string: "#6e690d"
  literal_string_escape: "#3d7151"
  generic_deleted: "#c8231c"
  generic_subheading: "#71655a"
  background: "#fbf1c7"
  error_fg: "#bc211a"
  error_bg: "#f2d5d5"
  success: "#6e690d"

markdown:
  heading: "#076678"
  link: "#417957"
  strong: "#3c3836"
  code: "#8e5c10"
  code_bg: "#f2e5bc"
  blockquote: "#786b61"
  list: "#3c3836"
  hr: "#bdae93"