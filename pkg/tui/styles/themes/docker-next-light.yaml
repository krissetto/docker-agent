version: 1
name: "Docker Next - Light"
# Zero page, Canvas raised surfaces, Base/Console accents.
# Trailing comments name the exact brand anchor or the derivation from anchors.
colors:
  # Text
  text_bright: "#101010"  # Ether
  text_primary: "#101010"  # Ether
  text_secondary: "#64605C"  # Neutral +59% toward Ether
  text_muted: "#64605C"  # Neutral +59% toward Ether
  text_faint: "#87827B"  # Neutral +42% toward Ether
  # Accent
  accent: "#4154F3"  # Base +30% toward Console (text-safe on raised surface)
  accent_muted: "#545DB6"  # Base +45% toward light muted text
  # Surfaces
  background: "#FFFDFA"  # Zero
  background_alt: "#EEE9E3"  # Canvas +30% toward Neutral
  # Borders
  border_secondary: "#7A756F"  # Neutral +48.5% toward Ether
  # Status
  success: "#096B3C"  # Flux +57% toward Ether
  error: "#AE2324"  # Trigger +50% toward Root
  warning: "#9E4800"  # Sand hue, HSL 27/100/31
  info: "#3D50EB"  # Base +50% toward Console
  highlight: "#7E428A"  # Bloom hue, HSL 290/35/40
  # Brand
  brand: "#475BFF"  # Base
  brand_bg: "#D1E4FF"  # Air
  # Errors
  error_strong: "#AE2324"  # Trigger +50% toward Root
  error_dark: "#FFEAE7"  # Trigger 10% over Zero
  # Spinner ramp
  spinner_dim: "#3D50EB"  # Base +50% toward Console
  spinner_bright: "#384AE0"  # Base +75% toward Console
  spinner_brightest: "#3345D6"  # Console
  # Diff
  diff_add_bg: "#CCF8E0"  # Flux 20% over Zero
  diff_remove_bg: "#FFDEDC"  # Trigger 16% over Zero
  # UI elements
  line_number: "#64605C"  # Neutral +59% toward Ether
  separator: "#89847D"  # Neutral +41% toward Ether
  selected: "#D1E4FF"  # Air
  selected_fg: "#FFFDFA"  # Zero
  suggestion_ghost: "#64605C"  # Neutral +59% toward Ether
  tab_bg: "#FFFDFA"  # Zero
  tab_active_bg: "#EEE9E3"  # Canvas +30% toward Neutral
  tab_active_fg: "#101010"  # Ether
  tab_inactive_fg: "#64605C"  # Neutral +59% toward Ether
  tab_border: "#4154F3"  # Base +30% toward Console (text-safe on raised surface)
  # Shared shell/editor semantic roles
  placeholder: "#64605C"  # Neutral +59% toward Ether
  editor_bg: "#EEE9E3"  # Canvas +30% toward Neutral
  card_bg: "#EEE9E3"  # Canvas +30% toward Neutral
  shell_bg: "#FFFDFA"  # Zero
  tab_hover_bg: "#EEE9E3"  # Canvas +30% toward Neutral
  tab_hover_fg: "#101010"  # Ether
  tab_drag_bg: "#3345D6"  # Console
  tab_drag_fg: "#FFFDFA"  # Zero
  tab_busy: "#AB4A2D"  # Launch +35% toward Ether
  context_empty: "#FFFDFA"  # Zero
  context_fill: "#3345D6"  # Console
  context_text: "#64605C"  # Neutral +59% toward Ether
  resize: "#89847D"  # Neutral +41% toward Ether
  resize_hover: "#4154F3"  # Base +30% toward Console (text-safe on raised surface)
  resize_active: "#101010"  # Ether
  hover_lightness: -0.20  # HoverText darkens 0.20 HSL L on light surfaces (absent = legacy +0.25)
  hover_text: "#3345D6"  # Console; hover target for primary/bright text (absent = lightness shift only)
  review_rest_fg: "#64605C"  # = text_muted; resting review rows draw the name muted instead of FadeLine .55 (absent = legacy fade)
  hint: "#64605C"  # Neutral +59% toward Ether
  focus: "#4154F3"  # Base +30% toward Console (text-safe on raised surface)
  disabled: "#87827B"  # Neutral +42% toward Ether
  status_adjacent: "#64605C"  # Neutral +59% toward Ether
  scrollbar_track: "#DDD4C9"  # Neutral
  # Badges
  badge_accent: "#7E428A"  # Bloom hue, HSL 290/35/40
  badge_info: "#3345D6"  # Console
  badge_success: "#096B3C"  # Flux +57% toward Ether
  agent_hues: [233, 330, 200, 312, 170, 55, 151, 35, 290, 14]  # same set, reordered so generated light accents stay >=4.5:1

chroma:
  error_fg: "#5C0909"  # Root
  error_bg: "#FFEAE7"  # Trigger 10% over Zero
  success: "#0A6137"  # Flux +62% toward Ether (>=4.5 on diff emphasis)
  comment: "#56534F"  # Neutral +66% toward Ether (>=4.5 on diff emphasis)
  comment_preproc: "#883D26"  # Launch +50% toward Ether (>=4.5 on diff emphasis)
  keyword: "#3345D6"  # Console
  keyword_reserved: "#7E428A"  # Bloom hue, HSL 290/35/40
  keyword_namespace: "#AE2324"  # Trigger +50% toward Root
  keyword_type: "#7E428A"  # Bloom hue, HSL 290/35/40
  operator: "#883D26"  # Launch +50% toward Ether (>=4.5 on diff emphasis)
  punctuation: "#1D1D1D"  # Ink
  name_builtin: "#883D26"  # Launch +50% toward Ether (>=4.5 on diff emphasis)
  name_tag: "#3345D6"  # Console
  name_attribute: "#8F4000"  # Sand hue, HSL 27/100/28 (>=4.5 on diff emphasis)
  name_decorator: "#7E428A"  # Bloom hue, HSL 290/35/40
  literal_number: "#5C0909"  # Root
  literal_string: "#0A6137"  # Flux +62% toward Ether (>=4.5 on diff emphasis)
  literal_string_escape: "#883D26"  # Launch +50% toward Ether (>=4.5 on diff emphasis)
  generic_deleted: "#AE2324"  # Trigger +50% toward Root
  generic_subheading: "#56534F"  # Neutral +66% toward Ether (>=4.5 on diff emphasis)
  background: "#EEE9E3"  # Canvas +30% toward Neutral

markdown:
  heading: "#4154F3"  # Base +30% toward Console (text-safe on raised surface)
  link: "#3345D6"  # Console
  strong: "#101010"  # Ether
  code: "#5C0909"  # Root
  code_bg: "#EEE9E3"  # Canvas +30% toward Neutral
  blockquote: "#64605C"  # Neutral +59% toward Ether
  list: "#101010"  # Ether
  hr: "#7A756F"  # Neutral +48.5% toward Ether
