  strong: "#101010"  # Ether
  code: "#5C0909"  # Root
  code_bg: "#F5F2EE"  # Canvas
  blockquote: "#64605C"  # Neutral +59% toward Ether
  list: "#101010"  # Ether
  hr: "#87827B"  # Neutral +42% toward Ether
