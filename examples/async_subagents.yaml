# Async subagents use the `subagents` key. Declaring subagents implies the
# agent gets the async coordination tools (spawn_subagent, send_message) and
# the harness prompt automatically — no toolset entry is needed. Unlike the
# older `sub_agents` + background_agents pattern, agents communicate by message
# passing: a parent can spawn several subagents and simply end its response;
# it is resumed automatically when a subagent reports back. No polling.

agents:
  root:
    model: anthropic/claude-sonnet-5
    description: Coordinator that fans work out to async subagents
    instruction: |
      You are the coordinator. For independent work, spawn subagents in
      parallel, then simply finish your response if you have nothing else to
      do. Do not poll for status; you are resumed automatically when a subagent
      sends a message or finishes.
    subagents:
      - agent: web_researcher
        name: web
        description: Finds recent public information and cites sources
      - code_analyst

  web_researcher:
    model: openai/gpt-5.6-sol
    description: Searches the web and summarises findings with sources
    instruction: |
      Research the requested topic. Send concise progress updates to your
      parent when useful, and finish with sourced findings.
    toolsets:
      - type: mcp
        ref: docker:duckduckgo

  code_analyst:
    model: anthropic/claude-sonnet-5
    description: Analyses the local codebase and reports concrete findings
    instruction: |
      Inspect the local codebase. Reference files and symbols precisely, and
      finish with actionable technical findings.
    toolsets:
      - type: filesystem
      - type: shell
